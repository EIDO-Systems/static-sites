<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Radar Healthcare Lites Demo Center</title>
        <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css"/>
        <link rel="stylesheet" type="text/css" href="css/litedemo.css"/>
        <script src="https://sdk.amazonaws.com/js/aws-sdk-2.4.5.min.js"/>
        <script type="text/javascript" src="script/jquery-3.1.1.min.js"/>
        <script type="text/javascript" src="script/bootstrap.min.js"/>
        <script type="text/javascript" src="script/EIDO_S3Document.js"/>
        <script type="text/javascript" src="script/litedemo.js"/>
    </head>
    <body style="overflow-y:hidden;">
        <div class="page-wrapper">
            <div class="topbar-main">
                <div class="left-nav">
                    <span class="login"><b>Lites</b> Demo Centre</span>
                </div>
                <div class="right-nav">
                    <button type="button" class="btn btn-default" onclick="$('#instructions-modal').modal('show')">Help</button>
                    <select style="width:100px; padding:4px;display:inline-block;" name="territory" id="territory"/>
                    <select style="width:100px; padding:4px;display:inline-block;" name="filename" id="filename"/>
                    <a class="logo" href="http://www.radarhealthcare.com" target="_blank">
                        <img src="images/radar-logo-full-colour.png" alt="Radar Healthcare"/>
                    </a>
                </div>
            </div>            
            <div class="container">
                <div class="form-group row">
                    <div class="col-sm-4" style="margin-top:20px;">
                        <div id="index"/>
                    </div>
                    <div class="col-sm-8" style="margin-top:20px;">
                        <div class="docviewer">
                            <div id="pdflink" class="pull-right"/>
                            <div id="result"/>
                        </div>
                    </div>
                </div>
            </div>
            <div id="instructions-modal" class="modal fade" role="dialog">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true"><i class="fa fa-times-circle" aria-hidden="true"/></span></button>
                            <h4 class="modal-title">Implementation Notes</h4>
                        </div>
                        <div class="modal-body">
                            <p>The following are some implementation notes for the EIDO Lites dynamic online delivery solution.</p>
                            <p>This demo is available from the <a href="http://inform.eidosystems.com/litesdemo.html">EIDO Lites Demo Centre</a></p>
                            <h4>Code behind</h4>
                            <p>The Javascripts provided should work with jQuery as well as Prototype. We have not created a plain-vanilla version.</p>
                            <p>You can of course inspect the the structure of this in a browser. The Javascript libraries used can downloaded from the following links (right-click and use "Save link as ...":</p>
                            <p><a href="http://informadmin.eidosystems.com/script/EIDO_S3Document.js">http://informadmin.eidosystems.com/script/EIDO_S3Document.js</a></p>
                            <p><a href="http://informadmin.eidosystems.com/script/litedemo.js">http://informadmin.eidosystems.com/script/litedemo.js</a></p>
                            <h4>Putting it together into your pages</h4>
                            <p>In the package provided to you there is a Javascript library (litedemo.js), in that library is this function:</p>
                            <pre>
function getEIDOLiteDoc(territory, docnum, target){
    request = {}
    request.document = docnum;
    request.territory = territory;
    request.element = target;
    $(document).trigger('eidodoc:fetch', request);
}
                </pre>
                            <p>This function takes three inputs.</p>
                            <p><code>territory</code> … one of the following depending on your territory:</p>
                            <ul>
                                <li>AUS</li>
                                <li>CANADA</li>
                                <li>Discovery</li>
                                <li>SA</li>
                                <li>UK</li>
                                <li>UKRCS</li>
                                <li>USA</li>
                            </ul>
                            <p><code>docnum</code> … this is the EIDO document number (for example 'A01', 'B02', etc.)</p>
                            <p><code>target</code> … this is an id for an element in which the HTML content you retrieve will be injected. For example, one might 
                            have <code>&lt;div class="litescontent'/&gt;</code> in their web page and so you would pass in 'litescontent'. The HTML content 
                            of this <code>&lt;div&gt;</code> would be dynamically populated with the content from the EIDO Lites server.</p>
                            <p>There are additional convenience functions also inside the demo Javascript set you can use to get documents as well as build the link to PDF. If you look around the "litedemo.js" function you will see them and the documentation for using them.</p>
                        </div>
                        <div class="modal-footer input-form">
                            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
            
       </div>
    </body>
</html>
